<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>even odd</title>
</head>
<body>
  <script>
    function evenOdd(n){
      if(n%2==0)
      return 'even';
      else
      return 'odd';
    }
    console.log(evenOdd(2));
    console.log(evenOdd(9));
  </script>
</body>
</html>
