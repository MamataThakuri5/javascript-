<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    
    
    <title>My To-do list</title>
    <style>
      body{
        background-color:rgb(191, 188, 188);
        display:flex;
        flex-direction:column;
        align-items:center;
        padding:40px;
      }
      #input-area{
        display:flex;
        gap:8px;
      }
      #task-input {
  background-color: white;
  color: black;
  padding: 8px;
  border-radius: 8px;
  border: none;
  width: 200px;
}
#add-btn {
  background-color: rgb(164, 164, 224);
  border: none;
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;        
}
    #task-list {
  list-style: none;      
  padding: 0;
  width: 300px;
}
    </style>
  </head>
  <body>
    <h1>My To-Do List</h1>
    <div id="input-area">
    <input id="task-input" type="text" placeholder="type a task.">
    <button id="add-btn">Add</button>
    </div>
      <ul id="task-list">

      </ul>
     
      </body>
      <script>
        document.getElementById('add-btn').addEventListener('click',addTask);//Listen for button click

        function addTask(){//read the value
          let task=document.getElementById("task-input").value;
          if(task==""){
            alert("please enter a task first!");
            return;
          }
          //Create the task item
          let li=document.createElement("li");
          li.textContent=task;

          //Add complete on click
          li.addEventListener("click",function(){
            li.style.textDecoration="line-through";
            li.style.color="grey";
          });

          //Create delete button
          let deleteBtn=document.createElement("button");
          deleteBtn.textContent="❌";
          deleteBtn.addEventListener("click",function(){
            li.remove();
          });

          //Add button inside task, task inside list
          li.appendChild(deleteBtn);
          document.getElementById("task-list").appendChild(li);

          //Clear the input
          document.getElementById("task-input").value="";


        }
      </script>
      </html>
