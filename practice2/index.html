<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="style.css" />
    
    
    <title>Live Search</title>
    <style>
      #input-btn{
        background-color:rgb(248, 244, 244);
       align-items:center;
       height:30px;
       border:1px solid black;
       cursor:pointer;
      }
     
    </style>
  </head>
  <body>
    <input id="input-btn" type="text" placeholder="enter somethings..">
    <p id="display"></p>
      </body>
      <script>
        document.getElementById('input-btn').addEventListener("input",myfunction);
        function myfunction(){
          let input=document.getElementById("input-btn").value;
          document.getElementById("display").textContent=input;
         
        }

        
      </script>
      </html>
